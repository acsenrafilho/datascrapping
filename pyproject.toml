[project]
name = "datascrapping"
version = "0.1.0"
description = "CLI toolkit for structured web scraping and data collection"
authors = [
    {name = "Antonio Carlos Senra Filho", email = "acsenrafilho@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "beautifulsoup4 (>=4.12.0,<5.0.0)",
    "markdownify (>=0.14.0,<1.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "requests (>=2.31.0,<3.0.0)",
    "rich (>=14.0.0,<15.0.0)",
    "typer (>=0.16.0,<1.0.0)",
]

[project.optional-dependencies]
browser = [
    "playwright (>=1.40.0,<2.0.0)",
]
llm = [
    "google-generativeai (>=0.8.0,<1.0.0)",
]

[project.scripts]
datascrapping = "datascrapping.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "datascrapping", from = "src"}]

[tool.poetry.group.dev.dependencies]
blue = "^0.9.1"
isort = "^6.0.1"
pytest = "^8.4.0"
pytest-cov = "^6.2.0"
taskipy = "^1.14.1"

[tool.taskipy.tasks]
lint = "blue . && isort ."
test = "pytest -s -x --cov=datascrapping -vv"
post_test = "coverage html"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--doctest-modules"

[tool.isort]
profile = "black"
line_length = 79

[tool.blue]
line-length = 79
